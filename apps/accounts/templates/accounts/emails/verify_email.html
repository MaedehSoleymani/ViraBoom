<!DOCTYPE html>
<html lang="fa" dir="rtl">
<body style="margin:0;padding:24px;background:#F4F1EC;font-family:Tahoma,Arial,sans-serif;color:#2E2E2C;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border-radius:14px;">
    <tr><td style="padding:28px 28px 8px;font-size:20px;font-weight:bold;">{{ brand }}</td></tr>
    <tr><td style="padding:8px 28px;line-height:1.9;font-size:15px;">
      <p style="margin:0 0 12px;">سلام {{ user.get_short_name }}،</p>
      <p style="margin:0 0 20px;">برای تکمیل ثبت‌نام، ایمیل خود را تأیید کنید.</p>
      <a href="{{ verify_url }}" style="display:inline-block;background:#C6A75E;color:#2E2E2C;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:10px;">تأیید ایمیل</a>
      <p style="margin:20px 0 6px;font-size:13px;color:#6B665E;">اگر دکمه کار نکرد، این آدرس را در مرورگر باز کنید:</p>
      <p dir="ltr" style="margin:0;font-size:12px;word-break:break-all;color:#6B665E;">{{ verify_url }}</p>
    </td></tr>
    <tr><td style="padding:20px 28px 28px;font-size:12px;color:#6B665E;">این لینک {{ valid_hours }} ساعت معتبر است. اگر شما حساب نساخته‌اید، این ایمیل را نادیده بگیرید.</td></tr>
  </table>
</body>
</html>
