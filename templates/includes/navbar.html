{% load static %}
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{% url 'home' %}" aria-label="{{ SITE_NAME }} — صفحه اصلی">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="2" y="6" width="17" height="20" rx="3" fill="#B7B0A6"/>
        <rect x="6" y="3" width="17" height="20" rx="3" fill="#F4F1EC" stroke="#2E2E2C" stroke-width="1.5"/>
        <rect x="10" y="0" width="17" height="20" rx="3" fill="#C6A75E"/>
      </svg>
      <span>{{ SITE_NAME }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="sr-only">باز و بسته کردن منو</span>
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>

    <nav id="site-nav" class="nav-links" aria-label="منوی اصلی">
      <a href="{% url 'home' %}">خانه</a>
      {# هم‌تیمی‌ها لینک‌های خودشان را اینجا اضافه کنند: فروشگاه، دسته‌بندی‌ها، وبلاگ، سبد خرید #}
      <span class="nav-spacer"></span>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:dashboard' %}">داشبورد</a>
        {% if user.can_manage_users %}<a href="{% url 'accounts:user_list' %}">مدیریت کاربران</a>{% endif %}
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">خروج</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">ورود</a>
        <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">ثبت‌نام</a>
      {% endif %}
    </nav>
  </div>
</header>
