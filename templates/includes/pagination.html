{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="صفحه‌بندی">
  {% if page_obj.has_previous %}
    <a class="page-link" rel="prev" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">قبلی</a>
  {% endif %}
  <span class="page-info">صفحهٔ {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="page-link" rel="next" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">بعدی</a>
  {% endif %}
</nav>
{% endif %}
